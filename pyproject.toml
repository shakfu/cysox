[project]
name = "cysox"
version = "0.2.0"
description = "A Pythonic audio processing library wrapping libsox"
readme = "README.md"
license = "MIT"
# Bundled third-party code; see licenses/README.md.
license-files = ["LICENSE", "licenses/*", "vendor/kissfft/COPYING"]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
maintainers = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = [
    "audio",
    "sound",
    "sox",
    "libsox",
    "audio-processing",
    "effects",
    "cython",
    "dsp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shakfu/cysox"
Repository = "https://github.com/shakfu/cysox"
Documentation = "https://github.com/shakfu/cysox#readme"
Issues = "https://github.com/shakfu/cysox/issues"
Changelog = "https://github.com/shakfu/cysox/releases"

[project.scripts]
cysox = "cysox.__main__:main"

[build-system]
requires = ["scikit-build-core", "cython"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/cysox"]
wheel.exclude = [
	"*.c",
	"*.h",
	"*.pyx",
	"*.pxd",
	"*.pxi",
]
sdist.include = [
	"src/cysox/*.pxd",
	"src/cysox/*.pyx",
	"src/cysox/*.c",
	"include/*.h",
	"lib",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-benchmark",
    "memory-profiler",
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "twine>=6.2.0",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Disable benchmark output by default (runs tests but skips timing)
# Run benchmarks explicitly with: pytest --benchmark-enable
# Or run only benchmarks with: pytest --benchmark-only
addopts = "--benchmark-disable"

[tool.ruff.lint.per-file-ignores]
# tests/examples/*.py are line-by-line ports of the C programs beside them.
# Keeping the correspondence readable matters more than lint idiom here.
# E402: they extend sys.path before importing cysox, exactly as a user running
# the example from a checkout would have to.
"tests/examples/*.py" = ["F841", "E722", "E741", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff.lint]
# Chosen explicitly rather than inherited. Without this the project gets
# whatever ruff's defaults happen to be, and those changed between releases:
# the same unmodified tree passed under ruff 0.14.14 and reported 354
# diagnostics under 0.16.4, which is what turned the CI lint job red.
#
# This is ruff's classic default set. Widening it is a deliberate follow-up,
# not a side effect of a tool upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.cibuildwheel]
# Skip Windows and musllinux (Alpine uses apk, sox packaging is problematic)
skip = "*-win* *-musllinux_*"

# Python versions to build
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"

# Require the bundled formats, which 0.2.0 shipped without, then run the mp3
# decoder tests against the installed wheel: -I and an empty pythonpath keep
# pytest from importing src/ instead.
test-requires = ["pytest", "pytest-benchmark"]
test-command = [
    "python -c \"import cysox; from cysox import sox; sox.init(); print(f'cysox {cysox.__version__}, libsox {sox.version()}'); missing = [e for e in ('wav', 'flac', 'ogg', 'opus', 'mp3') if not sox.find_format(e, False)]; sox.quit(); assert not missing, f'missing formats: {missing}'\"",
    "cd {project} && CYSOX_MP3_DECODER=mpg123 python -I -m pytest -p no:cacheprovider -o pythonpath= tests/test_mp3_decode.py",
    "python -I {project}/scripts/smoke_test.py {project}",
    "python -I {project}/scripts/check-wheel-licenses.py",
]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

# Build libsox from source into lib/ (see scripts/build-libsox.sh). The
# distro sox package loads its codecs as plugins, which the wheel cannot find.
before-all = [
    "yum install -y epel-release",
    "yum install -y flac-devel libvorbis-devel libogg-devel opus-devel opusfile-devel lame-devel mpg123-devel libpng-devel zlib-devel pkgconfig",
    "scripts/build-libsox.sh .",
]

[tool.cibuildwheel.macos]
# Build for native architecture only (arm64 on macos-14, x86_64 on macos-13)
# Cross-compilation requires matching architecture libraries
archs = ["native"]

# macOS dependencies installed via Homebrew in workflow before cibuildwheel runs
before-build = "pip install cython"

# Use static linking to bundle libsox into the wheel. The codecs are Homebrew
# dylibs, whose minimum macOS is the runner's: 14.0 on macos-14.
environment = { STATIC = "1", MACOSX_DEPLOYMENT_TARGET = "14.0" }


