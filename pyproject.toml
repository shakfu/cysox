[project]
name = "cysox"
version = "0.1.11"
description = "A Pythonic audio processing library wrapping libsox"
readme = "README.md"
license = "MIT"
# Wheels bundle native libraries that keep their own licences; the notice and
# KissFFT's BSD text ride along inside every wheel.
license-files = ["LICENSE", "NOTICE-THIRD-PARTY.md", "vendor/kissfft/COPYING"]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
maintainers = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.9"
keywords = [
    "audio",
    "sound",
    "sox",
    "libsox",
    "audio-processing",
    "effects",
    "cython",
    "dsp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shakfu/cysox"
Repository = "https://github.com/shakfu/cysox"
Documentation = "https://github.com/shakfu/cysox#readme"
Issues = "https://github.com/shakfu/cysox/issues"
Changelog = "https://github.com/shakfu/cysox/releases"

[project.scripts]
cysox = "cysox.__main__:main"

[build-system]
requires = ["scikit-build-core", "cython"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/cysox"]
wheel.exclude = [
	"*.c",
	"*.h",
	"*.pyx",
	"*.pxd",
	"*.pxi",
]
sdist.include = [
	"src/cysox/*.pxd",
	"src/cysox/*.pyx",
	"src/cysox/*.c",
	"include/*.h",
	"lib",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-benchmark",
    "memory-profiler",
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "twine>=6.2.0",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Disable benchmark output by default (runs tests but skips timing)
# Run benchmarks explicitly with: pytest --benchmark-enable
# Or run only benchmarks with: pytest --benchmark-only
addopts = "--benchmark-disable"

[tool.ruff.lint.per-file-ignores]
# tests/examples/*.py are line-by-line ports of the C programs beside them.
# Keeping the correspondence readable matters more than lint idiom here.
# E402: they extend sys.path before importing cysox, exactly as a user running
# the example from a checkout would have to.
"tests/examples/*.py" = ["F841", "E722", "E741", "E402"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.cibuildwheel]
# Skip Windows and musllinux (Alpine uses apk, sox packaging is problematic)
skip = "*-win* *-musllinux_*"

# Python versions to build
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"

# Test the repaired wheel. Not just an import: the mp3 assertions catch a
# wheel whose bundled libsox lost its mp3 handler, which is otherwise silent.
test-requires = "pytest"
test-command = "python {project}/scripts/smoke_test.py {project}"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

# Build sox_ng from source rather than using the distro's libsox. The distro
# package delivers mp3 as a dlopen'd plugin that auditwheel cannot vendor, so
# wheels built against it have no mp3 support at all; sox_ng --without-mad
# compiles the handler in. See the long note in scripts/setup.sh.
#
# Note what is NOT installed here: sox / sox-devel. Leaving the distro libsox
# out of the container means there is no second libsox for pkg-config or the
# linker to find by accident.
before-all = [
    "yum install -y epel-release || true",
    "yum install -y flac-devel libvorbis-devel opus-devel opusfile-devel libogg-devel libpng-devel pkgconfig gcc gcc-c++ make bzip2 xz || (apt-get update && apt-get install -y libflac-dev libvorbis-dev libopus-dev libopusfile-dev libogg-dev libpng-dev pkg-config gcc g++ make bzip2 xz-utils)",
    "SOX_NG=1 bash scripts/setup.sh",
    # Backstop behind setup.sh's own HAVE_MAD / ldd assertions.
    "python3 scripts/check_licenses.py libs",
]

# setup.sh installs sox_ng under /usr/local; point the build and auditwheel at
# it rather than at any system copy.
environment = { PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig", LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64" }

# auditwheel vendors libsox and its dependencies into the wheel, so re-check
# what actually landed inside before the wheel is allowed out.
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
    "python3 scripts/check_licenses.py wheel {dest_dir}",
]

[tool.cibuildwheel.macos]
# Build for native architecture only (arm64 on macos-14, x86_64 on macos-13)
# Cross-compilation requires matching architecture libraries
archs = ["native"]

# macOS dependencies installed via Homebrew in workflow before cibuildwheel runs
before-build = "pip install cython"

# Static libsox is built by scripts/setup.sh, which hard-fails on HAVE_MAD.
# This is the backstop: check the archive carries no libmad symbols.
before-all = "python3 scripts/check_licenses.py libs"

# delocate bundles the dylibs; verify the result the same way Linux does.
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
    "python3 scripts/check_licenses.py wheel {dest_dir}",
]

# Use static linking to bundle libsox into the wheel
environment = { STATIC = "1" }


